<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сервис</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@500&family=Wix+Madefor+Text:wght@400&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="script.js" defer></script>
</head>
<body>

<main>
  <!-- hero: схема C, 60/40, фото в край окна -->
  <section class="hero" id="top" data-reveal-now>
    <div class="hero__text">
      <header class="top">
        <a class="logo rise d-300" href="#top" data-bind="name"></a>
        <nav class="nav rise d-420" aria-label="Разделы">
          <a class="nav__link" href="#prices">Цены</a>
          <a class="nav__link" href="#steps">Как работаем</a>
          <a class="nav__link" href="#contacts">Контакты</a>
        </nav>
      </header>
      <div class="hero__body">
        <h1 class="rise d-900" data-lines="heroTitle"></h1>
        <p class="hero__lead muted rise d-1040" data-bind="heroLead"></p>
        <div class="cta-row rise d-1200">
          <a class="btn btn--solid" href="#prices">
            <span class="btn__fill" aria-hidden="true"></span>
            <span class="btn__label" data-bind="heroCta"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>
          </a>
          <span class="hint" data-bind="heroHint"></span>
        </div>
      </div>
    </div>
    <div class="hero__media"><img data-photo="hero" alt="" fetchpriority="high"></div>
  </section>

  <section class="facts" data-reveal>
    <dl class="facts__list" data-list="facts"></dl>
  </section>

  <section class="prices" id="prices" data-reveal>
    <div class="section-head">
      <h2 class="rise" data-lines="pricesTitle"></h2>
      <p class="muted rise d-100" data-bind="pricesLead"></p>
    </div>
    <div class="prices__grid">
      <div class="price-list" data-list="services"></div>
      <aside class="calc" aria-live="polite">
        <span class="calc__label faint">Предварительно</span>
        <output class="calc__sum">0&nbsp;₸</output>
        <p class="calc__picked faint">Отметьте услуги в&nbsp;списке</p>
        <a class="btn btn--solid" href="#lead">
          <span class="btn__fill" aria-hidden="true"></span>
          <span class="btn__label" data-bind="calcCta"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>
        </a>
        <span class="hint" data-bind="calcHint"></span>
      </aside>
    </div>
  </section>

  <section class="steps" id="steps" data-reveal>
    <h2 class="rise" data-lines="stepsTitle"></h2>
    <ol class="steps__list" data-list="steps"></ol>
  </section>

  <section class="lead" id="lead" data-reveal>
    <div class="lead__media"><img data-photo="lead" alt="" loading="lazy"></div>
    <div class="lead__body">
      <h2 class="rise" data-lines="leadTitle"></h2>
      <p class="muted rise d-100" data-bind="leadLead"></p>
      <form class="form rise d-200" id="lead-form" novalidate>
        <label class="field">
          <span class="field__name">Имя</span>
          <input name="name" autocomplete="given-name" required>
        </label>
        <label class="field">
          <span class="field__name">Телефон</span>
          <input name="phone" type="tel" inputmode="tel" autocomplete="tel" required>
        </label>
        <label class="field field--wide">
          <span class="field__name" data-bind="extraLabel"></span>
          <input name="extra">
        </label>
        <p class="form__picked field--wide faint"></p>
        <div class="cta-row field--wide">
          <button class="btn btn--solid" type="submit">
            <span class="btn__fill" aria-hidden="true"></span>
            <span class="btn__label" data-bind="leadCta"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>
          </button>
          <span class="hint" data-bind="leadHint"></span>
        </div>
        <p class="form__error" role="alert" hidden>Укажите имя и&nbsp;телефон</p>
      </form>
    </div>
  </section>

  <section class="contacts" id="contacts" data-reveal>
    <h2 class="rise" data-lines="contactsTitle"></h2>
    <dl class="contacts__list rise d-100">
      <div><dt class="faint">Адрес</dt><dd data-bind="address"></dd></div>
      <div><dt class="faint">Часы работы</dt><dd data-bind="hours"></dd></div>
      <div><dt class="faint">Телефон</dt><dd><a data-href="tel" data-bind="phone"></a></dd></div>
    </dl>
    <div class="cta-row rise d-200">
      <a class="btn btn--line" data-href="gis" target="_blank" rel="noopener">
        <span class="btn__fill" aria-hidden="true"></span>
        <span class="btn__label">Проложить маршрут в&nbsp;2ГИС</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>
      </a>
      <a class="link" data-href="instagram" target="_blank" rel="noopener">Instagram</a>
      <a class="link" data-href="wa" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </section>
</main>

<footer class="foot">
  <span data-bind="name"></span>
  <span class="faint" data-bind="footer"></span>
</footer>

</body>
</html>
