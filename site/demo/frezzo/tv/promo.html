<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frezzo Promo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="tv" data-page="promo">
  <div class="stage" id="stage">
    <div class="slides" id="slides"></div>

      <span class="brand__name">Frezzo</span>

    <div class="progress" id="progress"></div>
    <div class="grain" aria-hidden="true"></div>
  </div>
  <script src="script.js"></script>

</html>
